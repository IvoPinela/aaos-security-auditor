name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
      description: Describe the situation in a real project.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: markdown
    attributes:
      value: "The tool stays static and offline by design: no running apps, fuzzing, or contact with devices or vehicles."
