name: False positive or missed issue
description: A rule flagged safe code, or missed a real problem
labels: [rule-quality]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. Please **remove real secrets and customer code** from anything you paste.
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: ANDROID-WEAK-HASH
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What happened
      options:
        - False positive (flagged safe code)
        - False negative (missed a real problem)
        - Wrong severity, MASVS or CWE mapping
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Smallest sample that shows it
      description: A few lines of code, manifest or Gradle. Include the file type.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the footer or by /api/health
