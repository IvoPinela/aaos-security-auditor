name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command or the clicks, and a minimal project if you can share one.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.13, Edge
